# Written by Furge. It builds this project and puts the website it makes on the furge-dist branch, where Furge
# picks it up and publishes it. It runs on your GitHub account; Furge never runs your code. You can delete this file and
# the furge-dist branch at any time.
name: Furge build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: furge-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install packages
        id: install
        shell: bash
        run: |
          set -o pipefail
          { if [ -f package-lock.json ]; then npm ci; else npm install; fi; } 2>&1 | tee "$RUNNER_TEMP/furge-build.log"
      - name: Build the website
        id: build
        shell: bash
        run: |
          set -o pipefail
          { npm run build; } 2>&1 | tee -a "$RUNNER_TEMP/furge-build.log"
      - name: Hand the website to Furge
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          OUT=""
          if [ "$OUTCOME" = "success" ]; then
            for d in dist build out _site public; do if [ -f "$d/index.html" ]; then OUT="$d"; break; fi; done
          fi
          STAGE="$RUNNER_TEMP/furge-dist"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          if [ -n "$OUT" ]; then
            cp -R "$OUT"/. "$STAGE"/; STATUS=ok
          else
            STATUS=failed
            tail -c 20000 "$RUNNER_TEMP/furge-build.log" > "$STAGE/furge-build.log" 2>/dev/null || true
            if [ "$OUTCOME" = "success" ]; then echo "The build finished, but made no folder with an index.html (looked in dist, build, out, _site, public)." >> "$STAGE/furge-build.log"; fi
          fi
          cd "$STAGE"
          git init -q -b furge-dist
          git config user.name "Furge build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "furge-build $GITHUB_SHA $STATUS"
          git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" furge-dist
